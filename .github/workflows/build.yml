name: Meowto Ranger Android CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
permissions:
  contents: write  # publish the rolling "preview" pre-release below
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android app
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Meowto-Ranger-CI-Preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Direct no-login phone download, always the newest pushed build:
      # https://github.com/<owner>/<repo>/releases/download/preview/Meowto-Ranger-preview.apk
      # Pre-release, so the in-app updater (releases/latest) ignores it.
      - name: Publish preview download link
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Meowto-Ranger-preview.apk
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview Meowto-Ranger-preview.apk --prerelease --target "$GITHUB_SHA" \
            --title "Preview build (ล่าสุด)" \
            --notes "APK ทดสอบล่าสุดจาก $GITHUB_REF_NAME ($GITHUB_SHA) · debug build ยังไม่ได้เซ็นถาวร"
